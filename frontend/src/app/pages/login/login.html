<div class="login">
  <div class="login-card card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">◈</span>
      <div>
        <h1>SECAD <span>Lite</span></h1>
        <p>Recepción y gestión de incidentes</p>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" [attr.aria-selected]="modo === 'institucional'"
              [class.active]="modo === 'institucional'" (click)="setModo('institucional')">
        Funcionario
      </button>
      <button type="button" role="tab" [attr.aria-selected]="modo === 'civil'"
              [class.active]="modo === 'civil'" (click)="setModo('civil')">
        Ciudadano
      </button>
    </div>

    <form (ngSubmit)="entrar()">
      <div class="field">
        <label for="usuario">{{ modo === 'institucional' ? 'Usuario institucional' : 'Correo' }}</label>
        <input id="usuario" name="usuario" [(ngModel)]="usuario"
               [placeholder]="modo === 'institucional' ? 'p. ej. operador1' : 'p. ej. ciudadano@correo.com'"
               autocomplete="username" />
      </div>

      <div class="field">
        <label for="clave">Contraseña</label>
        <input id="clave" name="clave" type="password" [(ngModel)]="contrasena"
               placeholder="••••••" autocomplete="current-password" />
      </div>

      <p class="error" *ngIf="error">{{ error }}</p>

      <button type="submit" class="btn btn--primary full" [disabled]="cargando">
        {{ cargando ? 'Ingresando…' : 'Ingresar' }}
      </button>

      <p class="hint" *ngIf="modo === 'institucional'">
        Demo: <code>operador1</code> · <code>supervisor1</code> · <code>admin1</code> (contraseña <code>demo</code>).
      </p>
      <p class="hint" *ngIf="modo === 'civil'">
        Demo: cualquier correo con contraseña <code>demo</code>.
      </p>
    </form>
  </div>

  <p class="foot">Versión SaaS liviana · multi-agencia · multicanal</p>
</div>

<!-- Flujo 2FA institucional reutilizado del SECAD (@policia/mfa). -->
<pmfa-flow
  [challenge]="mfaChallenge"
  [usuario]="usuario"
  (autenticado)="onMfaOk($event)"
  (cancelado)="mfaChallenge = null">
</pmfa-flow>
