<div class="login">
  <div class="login-card card">
    <div class="tema-fila"><app-tema-toggle /></div>
    <div class="brand">
      <app-logo [tam]="56" fondo="var(--surface)" />
      <div>
        <h1>FALCON <span>CAD</span></h1>
        <p>Sistema integrado de emergencias y despacho</p>
      </div>
    </div>

    <form (ngSubmit)="entrar()">
      <div class="field">
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" [(ngModel)]="usuario"
               placeholder="p. ej. operador1" autocomplete="username" />
      </div>

      <div class="field">
        <label for="clave">Contraseña</label>
        <input id="clave" name="clave" type="password" [(ngModel)]="contrasena"
               placeholder="••••••" autocomplete="current-password" />
      </div>

      <p class="error" *ngIf="error">{{ error }}</p>

      <button type="submit" class="btn btn--primary full" [disabled]="cargando">
        {{ cargando ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </div>

  <p class="foot">Gestión integral de emergencias · 123 · multi-agencia · multicanal</p>
</div>

<app-toast />
