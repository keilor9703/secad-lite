<div class="login">
  <div class="login-card card">
    <div class="tema-fila"><app-tema-toggle /></div>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">◈</span>
      <div>
        <h1>FALCON <span>CAD</span></h1>
        <p>Recepción y gestión de incidentes</p>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" [attr.aria-selected]="modo === 'usuario'"
              [class.active]="modo === 'usuario'" (click)="setModo('usuario')">
        Usuario
      </button>
      <button type="button" role="tab" [attr.aria-selected]="modo === 'ciudadano'"
              [class.active]="modo === 'ciudadano'" (click)="setModo('ciudadano')">
        Ciudadano
      </button>
    </div>

    <form (ngSubmit)="entrar()">
      <div class="field">
        <label for="usuario">{{ modo === 'usuario' ? 'Usuario' : 'Correo' }}</label>
        <input id="usuario" name="usuario" [(ngModel)]="usuario"
               [placeholder]="modo === 'usuario' ? 'p. ej. operador1' : 'p. ej. ciudadano@correo.com'"
               autocomplete="username" />
      </div>

      <div class="field">
        <label for="clave">Contraseña</label>
        <input id="clave" name="clave" type="password" [(ngModel)]="contrasena"
               placeholder="••••••" autocomplete="current-password" />
      </div>

      <p class="error" *ngIf="error">{{ error }}</p>

      <button type="submit" class="btn btn--primary full" [disabled]="cargando">
        {{ cargando ? 'Ingresando…' : 'Ingresar' }}
      </button>

      <p class="hint" *ngIf="modo === 'usuario'">
        Demo: <code>superadmin</code> · <code>admin1</code> · <code>supervisor1</code> · <code>operador1</code> (contraseña <code>demo</code>).
      </p>
      <p class="hint" *ngIf="modo === 'ciudadano'">
        Demo: cualquier correo con contraseña <code>demo</code>.
      </p>
    </form>
  </div>

  <p class="foot">Gestión integral de emergencias · 123 · multi-agencia · multicanal</p>
</div>
