<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">◈</span>
    <strong>FALCON <span>CAD</span></strong>
  </div>

  <nav class="nav" *ngIf="sesion() as s">
    <ng-container *ngIf="s.tipo === 'institucional'; else navCivil">
      <ng-container *ngIf="operativoVisible()">
        <a routerLink="/recepcion" routerLinkActive="active">Recepción</a>
        <a routerLink="/llamadas" routerLinkActive="active" class="nav-llamadas">
          Llamadas
          <span class="ring-badge" *ngIf="sonando().length">{{ sonando().length }}</span>
        </a>
        <a routerLink="/recursos" routerLinkActive="active">Recursos</a>
        <a routerLink="/dashboard" routerLinkActive="active">Panel</a>
      </ng-container>
      <a *ngIf="esAdmin()" routerLink="/admin" routerLinkActive="active">Administración</a>
    </ng-container>
    <ng-template #navCivil>
      <a routerLink="/chat" routerLinkActive="active">Mi chat</a>
    </ng-template>
  </nav>

  <div class="user" *ngIf="sesion() as s">
    <label class="tenant-sel" *ngIf="esSuperadmin(); else tenantFijo" title="Tenant en gestión">
      <select [value]="tenantCtx()" (change)="cambiarTenant($any($event.target).value)"
              aria-label="Tenant en gestión">
        <option value="" disabled>tenant…</option>
        <option *ngFor="let t of tenants()" [value]="t.codigo">{{ t.codigo }}</option>
      </select>
    </label>
    <ng-template #tenantFijo>
      <span class="tenant" title="Tenant (instancia)">{{ s.tenant || 'global' }}</span>
    </ng-template>
    <span class="who">
      <span class="name">{{ s.nombre }}</span>
      <span class="tipo" [class.civil]="s.tipo === 'civil'">{{ s.rol }}</span>
    </span>
    <button type="button" class="btn btn--ghost" (click)="salir()">Salir</button>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
