<div class="selector-municipio">
  <app-selector
    [disabled]="deshabilitado()"
    [ngModel]="departamentoSel()"
    (ngModelChange)="cambiarDepartamento($event)"
    [ariaLabel]="'Departamento'"
  >
    <app-opcion [valor]="''">Departamento…</app-opcion>
    @for (d of departamentos(); track d.codigoDane) {
      <app-opcion [valor]="d.codigoDane">{{ d.nombre }}</app-opcion>
    }
  </app-selector>
  <app-selector
    [disabled]="deshabilitado() || !departamentoSel()"
    [ngModel]="municipioSel()"
    (ngModelChange)="cambiarMunicipio($event)"
    [ariaLabel]="'Municipio'"
  >
    <app-opcion [valor]="''">Municipio…</app-opcion>
    @for (m of municipios(); track m.codigoDane) {
      <app-opcion [valor]="m.codigoDane">{{ m.nombre }}</app-opcion>
    }
  </app-selector>
  @if (municipioSel()) {
    <span class="dane" title="Código DANE (DIVIPOLA)">{{ municipioSel() }}</span>
  }
  @if (subregionSel(); as sub) {
    <span class="subregion">{{ sub }}</span>
  }
</div>
