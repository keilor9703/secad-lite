<div class="selector" (focusout)="onFocusOut($event)">
  <button
    type="button"
    class="sel-disparador"
    [id]="id()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-haspopup]="'listbox'"
    [attr.aria-expanded]="abierto()"
    [attr.aria-activedescendant]="indiceActivo() >= 0 ? optionId(indiceActivo()) : null"
    [disabled]="deshabilitado()"
    (click)="alternar()"
    (keydown)="onKeydown($event)"
  >
    <span class="sel-etq">{{ etiquetaActual() }}</span>
  </button>
  <div class="sel-lista" [class.abierta]="abierto()" [attr.aria-hidden]="!abierto()">
    @if (abierto()) {
      <input
        #campoBusqueda
        type="text"
        class="sel-buscar"
        placeholder="Buscar…"
        autocomplete="off"
        role="searchbox"
        aria-label="Buscar en la lista"
        [value]="busqueda()"
        (input)="onBuscar($any($event.target).value)"
        (keydown)="onKeydown($event)"
        (mousedown)="$event.stopPropagation()"
      />
    }
    <ul class="sel-opciones" role="listbox" [id]="id() + '-lista'">
      <ng-content></ng-content>
      @if (busqueda() && !hayVisibles()) {
        <li class="sel-vacio">Sin resultados</li>
      }
    </ul>
  </div>
</div>
