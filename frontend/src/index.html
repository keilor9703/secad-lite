<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FALCON CAD</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="color-scheme" content="light dark">
  <script>
    // Aplica el tema guardado antes de pintar, para no ver un destello del otro.
    (function () {
      try {
        var t = localStorage.getItem('falconcad_tema');
        if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t;
      } catch (e) { /* almacenamiento no disponible */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
