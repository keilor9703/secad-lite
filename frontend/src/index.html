<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FALCON CAD | Sistema integrado de emergencias y despacho</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Aplica el tema guardado antes de pintar, para no ver un destello del otro.
    (function () {
      try {
        var t = localStorage.getItem('falconcad_tema');
        if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t;
      } catch (e) { /* almacenamiento no disponible */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
